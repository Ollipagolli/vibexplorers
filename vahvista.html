  <main style="padding-top:72px">
    <section class="sec reg" id="vahvista">
      <div class="wrap narrow">
        <span class="label">Jonotuslista</span>
        <h2 data-title>Vahvistetaan paikkaa…</h2>
        <div class="reg-done" data-out aria-live="polite"><p>Hetki…</p></div>
      </div>
    </section>
  </main>
  <script>
  (function () {
    var t = (location.hash || '').slice(1), out = document.querySelector('[data-out]'), h = document.querySelector('[data-title]');
    function show(title, html) { h.textContent = title; out.innerHTML = html; }
    if (!/^[a-f0-9]{64}$/.test(t)) { show('Linkki ei toimi.', '<p>Avaa linkki suoraan sähköpostista tai kirjoita <a href="mailto:vibexhq@gmail.com">vibexhq@gmail.com</a>.</p>'); return; }
    var tries = 0;
    function go() {
      fetch('https://script.google.com/macros/s/AKfycbwpaGGxiNfeCe-fEAa7WxTKQgsAnlOfkSeM9Txe16iZOwWGrtiJBPius-hAwYCuT9dB/exec', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'confirm', token: t }) })
        .then(function (r) { return r.json(); })
        .then(function (r) {
          if (r.ok && r.status === 'booked') show('Paikka on vahvistettu!', '<p>Tervetuloa mukaan! Vahvistus tulee sähköpostiin, ja lasku lähtee erikseen. Laskun eräpäivä on <b>' + r.dueDate + '</b>.</p>');
          else if (r.ok) show('Paikka on jo vahvistettu.', '<p>Kaikki on kunnossa. Tiedot löytyvät sähköpostistasi.</p>');
          else if (r.retry && tries++ < 3) setTimeout(go, 2000 * tries);
          else if (r.error === 'expired') show('Tarjous on vanhentunut.', '<p>Valitettavasti 48 tunnin vahvistusaika ehti umpeutua, ja paikka on tarjottu seuraavalle. Kysy tilannetta: <a href="mailto:vibexhq@gmail.com">vibexhq@gmail.com</a>.</p>');
          else show('Linkki ei toimi.', '<p>' + (r.message || 'Kirjoita meille') + ' <a href="mailto:vibexhq@gmail.com">vibexhq@gmail.com</a></p>');
        })
        .catch(function () { if (tries++ < 3) setTimeout(go, 2000 * tries); else show('Yhteys ei toiminut.', '<p>Päivitä sivu hetken päästä.</p>'); });
    }
    go();
  })();
  </script>

  <script>
    (function () {
      var nav = document.querySelector('.nav');
      var onScroll = function () { nav.classList.toggle('solid', window.scrollY > 40); };
      onScroll(); window.addEventListener('scroll', onScroll, { passive: true });
      var els = document.querySelectorAll('.rv');
      if (!('IntersectionObserver' in window)) { els.forEach(function (el) { el.classList.add('in'); }); return; }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
      }, { rootMargin: '0px 0px -8% 0px' });
      els.forEach(function (el) { io.observe(el); });
    })();
  </script>
